name: Refresh English timetable (GitHub Raw)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: uom-english-timetable
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch official timetable and format in English
        env:
          UPSTREAM_ICS_URL: ${{ secrets.UPSTREAM_ICS_URL }}
        run: |
          set -euo pipefail
          if [ -z "$UPSTREAM_ICS_URL" ]; then
            echo 'Missing UPSTREAM_ICS_URL secret in Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi
          python3 calendar/format_calendar.py
          mkdir -p calendar
          cp site/timetable.ics calendar/UoM_Robotics_English_Live.ics
      - name: Commit refreshed English feed if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendar/UoM_Robotics_English_Live.ics
          if git diff --cached --quiet; then
            echo "No changes to calendar"
            exit 0
          fi
          git commit -m "chore(calendar): refresh English timetable"
          git push
